<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100d19"><title>Mod Panel · Community Queue</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="shell mod-shell"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">CQ</span><span>COMMUNITY <b>QUEUE</b></span></a><a class="back-link" href="/">← Viewer page</a></header>
<section id="login-view" class="login-wrap"><div class="panel login-card"><p class="eyebrow">MODERATOR ACCESS</p><h1>Welcome back.</h1><p class="subhead">Enter your mod PIN to manage tonight's queue.</p><form id="login-form"><label class="field-label" for="pin">Moderator PIN</label><div class="login-input"><input type="password" id="pin" autocomplete="current-password" required><button type="submit">Unlock <span>→</span></button></div></form></div></section>
<section id="panel-view" class="hidden"><div class="mod-title"><div><p class="eyebrow">MODERATOR CONTROL</p><h1>Queue control</h1></div><button id="lock-button" class="button button-quiet">Lock panel</button></div><section class="now-card panel mod-current"><div class="section-label"><span class="pulse"></span> NOW PLAYING</div><div id="mod-current" class="current-player">Queue is open</div><div id="mod-current-time" class="current-time">Waiting for someone to join</div><div class="current-actions"><button id="finish-button" class="button button-primary">Finish player</button><button id="rotate-button" class="button button-quiet">Move to end</button></div></section><section class="waiting panel"><div class="list-heading"><div><p class="eyebrow">QUEUE MANAGEMENT</p><h2>Waiting players</h2></div><div class="heading-actions"><span id="mod-count" class="count-pill">0 waiting</span><button id="clear-button" class="button button-danger">Clear queue</button></div></div><div id="mod-list" class="mod-list"></div></section></section></main><div id="toast-area" class="toast-area" aria-live="polite"></div><script src="/socket.io/socket.io.js"></script><script src="/mod.js"></script></body></html>
